services:
  # Opt-in Doris 4.0.7 development target. This 1 FE + 1 BE topology is not HA
  # and is not production evidence. Start it with `--profile doris`.
  doris-fe:
    profiles: ["doris"]
    image: apache/doris:fe-4.0.7
    container_name: ${DORIS_FE_CONTAINER_NAME:-langfuse-doris-fe}
    hostname: doris-fe
    entrypoint: ["sh", "-c"]
    command:
      - >
        sed -i 's/-Xmx8192m -Xms8192m/-Xmx2048m -Xms2048m/' /opt/apache-doris/fe/conf/fe.conf
        && exec bash /usr/local/bin/init_fe.sh
    environment:
      - FE_SERVERS=fe1:172.29.0.2:9010
      - FE_ID=1
    ports:
      - ${HOST_IP:-127.0.0.1}:${DORIS_FE_HTTP_PORT:-8031}:8030
      - ${HOST_IP:-127.0.0.1}:${DORIS_FE_MYSQL_PORT:-9031}:9030
    volumes:
      - langfuse_doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - langfuse_doris_fe_logs:/opt/apache-doris/fe/log
    mem_limit: 3g
    networks:
      doris-dev:
        ipv4_address: 172.29.0.2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/bootstrap || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  doris-be:
    profiles: ["doris"]
    image: apache/doris:be-4.0.7
    container_name: ${DORIS_BE_CONTAINER_NAME:-langfuse-doris-be}
    hostname: doris-be
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo 'mem_limit_percentage = 70' >> /opt/apache-doris/be/conf/be.conf
        && exec bash /usr/local/bin/init_be.sh
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      - MASTER_FE_IP=172.29.0.2
      # FE advertises this private origin in its 307. Host-native workers must
      # validate it before applying the exact local-dev rewrite in .env.dev.
      - CURRENT_BE_IP=172.29.0.3
      - CURRENT_BE_PORT=9050
      - PRIORITY_NETWORKS=172.29.0.0/24
    ports:
      - ${HOST_IP:-127.0.0.1}:${DORIS_BE_HTTP_PORT:-8041}:8040
    volumes:
      - langfuse_doris_be_storage:/opt/apache-doris/be/storage
      - langfuse_doris_be_logs:/opt/apache-doris/be/log
    mem_limit: 4g
    networks:
      doris-dev:
        ipv4_address: 172.29.0.3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8040/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  clickhouse:
    # Upgrade from 24.3 to check behaviour on new events table.
    # Unit tests still verify 24.3 behaviour using -azure and -redis-cluster configs.
    image: docker.io/clickhouse/clickhouse-server:25.12
    user: "101:101"
    container_name: ${CLICKHOUSE_CONTAINER_NAME:-langfuse-clickhouse}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - ${HOST_IP:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${HOST_IP:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    depends_on:
      - postgres
    networks:
      - default

  minio:
    image: cgr.dev/chainguard/minio
    container_name: ${MINIO_CONTAINER_NAME:-langfuse-minio}
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - ${HOST_IP:-127.0.0.1}:${MINIO_API_PORT:-9090}:9000
      - ${HOST_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9091}:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    networks:
      - default

  floci:
    profiles:
      - worker-tests
    image: docker.io/floci/floci:1.5.17-compat
    user: "0"
    container_name: ${FLOCI_CONTAINER_NAME:-langfuse-floci}
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: 120
    ports:
      - ${HOST_IP:-127.0.0.1}:${FLOCI_PORT:-4566}:4566
    volumes:
      # Floci Lambda starts real Docker containers for function invocations.
      # See: https://floci.io/floci/services/lambda/
      - /var/run/docker.sock:/var/run/docker.sock
      # The init hook packages these local runner sources into Lambda ZIPs on startup.
      - ./scripts/code-eval-runners:/opt/code-eval-runners:ro
      - ./scripts/code-eval-runners/bootstrap-floci.py:/etc/floci/init/ready.d/01-bootstrap-code-eval-runners.py:ro
    networks:
      - default

  redis:
    image: docker.io/redis:7.2.4
    container_name: ${REDIS_CONTAINER_NAME:-langfuse-redis}
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:-myredissecret}
      --maxmemory-policy noeviction
    ports:
      - ${HOST_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379
    networks:
      - default

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    container_name: ${POSTGRES_CONTAINER_NAME:-langfuse-postgres}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
      - PGTZ=UTC
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  langfuse_doris_fe_meta:
    name: ${DORIS_FE_META_VOLUME_NAME:-langfuse_doris_fe_meta}
  langfuse_doris_fe_logs:
    name: ${DORIS_FE_LOGS_VOLUME_NAME:-langfuse_doris_fe_logs}
  langfuse_doris_be_storage:
    name: ${DORIS_BE_STORAGE_VOLUME_NAME:-langfuse_doris_be_storage}
  langfuse_doris_be_logs:
    name: ${DORIS_BE_LOGS_VOLUME_NAME:-langfuse_doris_be_logs}
  langfuse_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-langfuse_postgres_data}
    driver: local
  langfuse_clickhouse_data:
    name: ${CLICKHOUSE_DATA_VOLUME_NAME:-langfuse_clickhouse_data}
    driver: local
  langfuse_clickhouse_logs:
    name: ${CLICKHOUSE_LOGS_VOLUME_NAME:-langfuse_clickhouse_logs}
    driver: local
  langfuse_minio_data:
    name: ${MINIO_VOLUME_NAME:-langfuse_minio_data}
    driver: local

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-langfuse-network}
    driver: bridge
  doris-dev:
    name: ${DORIS_DEV_NETWORK_NAME:-langfuse-doris-dev}
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
